[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals-starter"
version = "0.1.0"
description = "A small, runnable eval harness for a tool-using agent: YAML cases, state assertions, repeated runs and a regression gate for CI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mohammed Alrubaie" }]
keywords = ["llm", "agents", "evals", "evaluation", "testing", "ci"]
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
claude = ["anthropic==1.11.0"]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
agent-evals = "agent_evals.cli:main"

[project.urls]
Repository = "https://github.com/MoAlrubaie/agent-evals-starter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
